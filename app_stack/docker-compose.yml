services:
  # ============================================================================
  # Nginx Reverse Proxy Service (Public Ingress)
  # ============================================================================
  reverse_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: serveradmin_nginx
    ports:
      - "${HOST_PORT_HTTP:-80}:80"
      - "${HOST_PORT_HTTPS:-443}:443"
    depends_on:
      web_app:
        condition: service_healthy
    networks:
      - frontend_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Node.js Application Service (Internal Tier)
  # ============================================================================
  web_app:
    build:
      context: ./web_app
      dockerfile: Dockerfile
    container_name: serveradmin_webapp
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - PORT=3000
      - APP_NAME=${APP_NAME:-ServerAdmin Lab Portal}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secure_devops_redis_key}
    depends_on:
      cache:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Redis Cache & Session Store (Isolated Backend Tier)
  # ============================================================================
  cache:
    image: redis:7-alpine
    container_name: serveradmin_cache
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secure_devops_redis_key}", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_devops_redis_key}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  cache_data:
    driver: local

