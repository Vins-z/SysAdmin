upstream web_app_upstream {
    server web_app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nginx Health Check Probe
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "nginx reverse proxy healthy\n";
    }

    # Reverse Proxy to Web Application
    location / {
        # Rate Limiting
        limit_req zone=api_limit_per_ip burst=20 nodelay;
        limit_conn conn_limit_per_ip 20;

        proxy_pass http://web_app_upstream;
        proxy_http_version 1.1;

        # Connection and Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts and Buffers
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

